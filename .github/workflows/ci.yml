name: CI

on:
  # All pull requests, including stacked ones whose base is another feature branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Branch name
        run: node scripts/check-branch-name.mjs "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - name: Commit messages
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Pull request title
        run: echo "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Traceability matrix is up to date
        run: npm run traceability:check

  test:
    # Unit and integration tests; integration tests start PostgreSQL with Testcontainers.
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests
        if: matrix.node != 24
        run: npm test
      # NFR-51: coverage thresholds are enforced once, on the pinned Node version.
      - name: Tests with coverage thresholds
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Upload coverage reports
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/contracts/coverage
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 120
        env:
          AUTH_RATE_LIMIT_PER_MINUTE: '1000'
      - name: Smoke test through the web server
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
      - name: Containers run as non-root users (NFR-16)
        run: |
          for service in api web; do
            uid=$(docker compose exec -T "$service" id -u)
            echo "$service runs as uid $uid"
            test "$uid" != "0"
          done
      # NFR-50, NFR-52: end-to-end tests in Chromium, Firefox and WebKit against the
      # production images.
      - name: Install end-to-end test dependencies
        run: |
          npm ci --workspace @backoffice/e2e --include-workspace-root --ignore-scripts
          npx --workspace @backoffice/e2e playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests
        run: npm run e2e --workspace @backoffice/e2e -- --trace off
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
