name: Delivery

# Every push to main: publish images -> deploy to staging -> full e2e on staging ->
# release-please. release-please runs only after the e2e suite passed on staging, so a
# release (and the production deployment it triggers, see release.yml) always refers to
# images that were tested end to end in a real environment.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/oleksadid/backoffice-user-management

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Staging
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ needs.publish.outputs.tag }}
      url: https://test-staging.oleksa.live
    secrets: inherit

  # The full end-to-end suite against the deployed staging environment, in all three
  # browsers. A release (and therefore production) only follows a passing run.
  e2e-staging:
    name: E2E on staging
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install end-to-end test dependencies
        run: |
          npm ci --workspace @backoffice/e2e --include-workspace-root --ignore-scripts
          npx --workspace @backoffice/e2e playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests against staging
        run: npm run e2e --workspace @backoffice/e2e -- --trace off --workers 2
        env:
          E2E_BASE_URL: https://test-staging.oleksa.live
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-staging
          path: e2e/playwright-report
          retention-days: 7

  release-please:
    name: Release PR
    needs: e2e-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A token other than GITHUB_TOKEN, so that the release PR triggers CI and the
          # published release triggers release.yml (events from GITHUB_TOKEN do not).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
