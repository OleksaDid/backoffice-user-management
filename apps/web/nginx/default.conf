# Serves the SPA and proxies /api to the API container (same origin, no CORS).
# Chain in production: Cloudflare edge -> cloudflared -> this server (:8080, HTTP) -> api:3000.

# Client IP: Cloudflare's CF-Connecting-IP when present, otherwise the direct peer.
# Safe because this server is reachable only through the tunnel (or locally).
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# TLS terminates at Cloudflare, which sends X-Forwarded-Proto: https.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's embedded DNS: resolve the API at request time, so this server starts
    # (and keeps working) even if the API container is restarted or not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Container health check for the web server itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Overwrite (not append) so client-supplied values are dropped.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 64k;

        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security $hsts always;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
