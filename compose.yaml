# Local, production-like stack: `docker compose up --build`, then open http://localhost:8080.
# Credentials below are for local use only; servers use their own secret env files.
name: backoffice

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: backoffice
      POSTGRES_DB: backoffice
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backoffice -d backoffice']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off step: applies pending migrations, then exits (DATA-03).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: backoffice-api:local
    command: ['npm', 'run', 'migrate']
    environment: &api-env
      DATABASE_URL: postgres://backoffice:backoffice@db:5432/backoffice
      LOG_LEVEL: info
      # The web server is the only proxy in front of the API.
      TRUST_PROXY_HOPS: '1'
      PUBLIC_ORIGIN: http://localhost:8080
      # Plain HTTP locally: insecure cookies are only accepted outside production mode
      # (AUTH-20); servers run in production mode with the default Secure cookies.
      NODE_ENV: development
      COOKIE_SECURE: 'false'
      # CI raises it so the end-to-end suite is not throttled.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]

  api:
    image: backoffice-api:local
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Public entry point: the SPA and /api on one origin.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: backoffice-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

volumes:
  db-data:
